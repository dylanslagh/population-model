<meta property="og:description" content="A 237-country model measures the selection effect hidden inside national fertility averages—and the decline required to cancel it.">
<meta property="og:url" content="https://population.dylanslagh.com/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  color-scheme: dark;
  --bg:#05070c;          /* deep space: the page commits to one look */
  --bg-2:#080c14;
  --panel:#0c121c;
  --panel-2:#111927;
  --line:#1c2736;
  --line-2:#2a3648;
  --ink:#eef2f7;
  --ink-2:#aab6c8;
  --muted:#71809a;

  /* Categorical marks. Validated for CVD separation, chroma and contrast
     against this surface; do not substitute by eye. */
  --gold:#c38617;        /* this project's mechanism */
  --cyan:#1aa1d2;        /* the conventional reference */
  --rose:#fb4374;        /* the pressure scenario */
  --violet:#a571fb;      /* the probabilistic comparator */

  /* Sequential ramp, one hue, monotone lightness. */
  --seq-1:#724d0b; --seq-2:#8f6110; --seq-3:#ad7716;
  --seq-4:#cd8d1c; --seq-5:#f1a723; --seq-6:#fdcb84;

  --lamp:#ffd9a0;        /* the lights on the globe: a rendering, not an encoding */
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Space Grotesk","Inter",ui-sans-serif,system-ui,sans-serif;
  --measure:34rem;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 17px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:var(--display); font-weight:600; letter-spacing:-.022em; line-height:1.08}
a{color:var(--ink); text-underline-offset:3px; text-decoration-color:#5a6a84}
a:hover{text-decoration-color:var(--gold)}
:focus-visible{outline:2px solid var(--seq-5); outline-offset:3px; border-radius:3px}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ------------------------------------------------------------------- stage */
#stage{position:fixed; inset:0; z-index:0; pointer-events:none}
#sky{display:block; width:100%; height:100%}
#veil{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0;
  background:radial-gradient(120% 90% at 50% 45%,rgba(5,7,12,.55) 0%,rgba(5,7,12,.93) 62%,#05070c 100%)}
#grain{position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.045; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.6'/></svg>")}

/* --------------------------------------------------------------------- hud */
#hud{position:fixed; left:clamp(18px,3.2vw,44px); bottom:clamp(18px,3.2vw,40px); z-index:4;
  font-family:var(--display); pointer-events:none; opacity:0; transition:opacity .5s ease}
#hud.on{opacity:1}
#hud .year{font-size:clamp(40px,6.4vw,74px); font-weight:500; line-height:.92;
  letter-spacing:-.04em; color:var(--ink); text-shadow:0 0 34px rgba(255,200,130,.28)}
#hud .people{margin-top:6px; font:500 13px/1.4 var(--sans); letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2)}
#hud .people b{color:var(--seq-6); font-weight:600}
#hud .basis{font:400 11.5px/1.4 var(--sans); letter-spacing:.05em; color:var(--muted); margin-top:2px}

/* ------------------------------------------------------------------ layout */
main{position:relative; z-index:3}
.chapter{position:relative; padding:0 clamp(18px,4.5vw,64px)}
.wrap{max-width:1180px; margin:0 auto}
.panel{max-width:var(--measure); padding:clamp(22px,3vw,30px) clamp(20px,2.6vw,30px);
  background:linear-gradient(180deg,rgba(9,13,21,.90),rgba(7,10,17,.82));
  border:1px solid var(--line); border-radius:14px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px -34px #000}
.panel.right{margin-left:auto}
.panel p{margin:0 0 1em}
.panel p:last-child{margin-bottom:0}
.eyebrow{font:600 11.5px/1.3 var(--sans); letter-spacing:.16em; text-transform:uppercase;
  color:var(--seq-5); margin:0 0 12px}
.chapter h2{font-size:clamp(26px,3.5vw,40px); margin:0 0 16px}
.lede{color:var(--ink-2); font-size:1.06em}
.dim{color:var(--muted); font-size:.86em; line-height:1.55}

/* reveal on scroll */
.rise{opacity:0; transform:translateY(26px); transition:opacity .85s cubic-bezier(.2,.7,.3,1),transform .85s cubic-bezier(.2,.7,.3,1)}
.rise.seen{opacity:1; transform:none}

/* --------------------------------------------------------------------- hero */
#hero{min-height:100svh; display:flex; flex-direction:column; justify-content:center;
  padding-top:12vh; padding-bottom:14vh;
  background:linear-gradient(101deg,rgba(5,7,12,.78) 0%,rgba(5,7,12,.52) 34%,rgba(5,7,12,.12) 58%,transparent 74%)}
#hero .kicker{font:600 clamp(10px,2.6vw,12px)/1.4 var(--sans); letter-spacing:.18em;
  text-transform:uppercase; color:var(--seq-5)}
#hero h1{font-size:clamp(48px,10.5vw,132px); font-weight:500; letter-spacing:-.05em;
  margin:18px 0 0; text-shadow:0 6px 60px rgba(0,0,0,.7)}
#hero h1 em{font-style:normal; color:var(--seq-6)}
#hero .sub{max-width:31rem; margin:24px 0 0; color:var(--ink-2); font-size:clamp(17px,2.1vw,21px); line-height:1.5}
#hero .by{margin:26px 0 0; color:var(--muted); font-size:14px}
.cue{position:absolute; left:50%; bottom:5vh; transform:translateX(-50%);
  font:500 11px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:10px}
.cue span{display:block; width:1px; height:44px;
  background:linear-gradient(180deg,transparent,var(--seq-5)); animation:drop 2.6s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(.2); transform-origin:top; opacity:0}
  40%{transform:scaleY(1); opacity:1} 100%{transform:scaleY(1); transform-origin:bottom; opacity:0}}

/* -------------------------------------------------------------------- beats */
.beat{min-height:118svh; display:flex; align-items:center}
.beat.tall{min-height:150svh}
.beat .wrap{width:100%}
.beat .panel{margin-top:8vh}

/* ------------------------------------------------------------------ figures */
.act{padding-top:9vh; padding-bottom:9vh}
.act .head{max-width:44rem; margin:0 0 clamp(26px,4vw,44px)}
.act .head h2{margin-bottom:14px}
.act .head p{color:var(--ink-2); margin:0 0 1em}
figure{margin:0; background:linear-gradient(180deg,rgba(10,15,24,.94),rgba(7,11,18,.9));
  border:1px solid var(--line); border-radius:16px; padding:clamp(16px,2.4vw,26px);
  box-shadow:0 30px 80px -50px #000}
figure + figure{margin-top:22px}
figcaption{color:var(--muted); font-size:13.5px; line-height:1.6; margin-top:14px; max-width:62rem}
figcaption b{color:var(--ink-2); font-weight:500}
.fig-title{font-family:var(--display); font-weight:600; font-size:17px; margin:0 0 4px}
.fig-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px}
.plot{width:100%; height:auto; display:block; overflow:visible}
.scroll-x{overflow:visible; max-width:100%; -webkit-mask-image:none; mask-image:none}
.scroll-x > svg{width:100%; min-width:0; max-width:100%}
.numbers .scroll-x{overflow-x:auto; overflow-y:hidden; scrollbar-width:thin;
  scrollbar-color:#2a3648 transparent}

/* svg primitives */
.ax-line{stroke:var(--line); stroke-width:1}
.grid-line{stroke:#141d2a; stroke-width:1}
.ax-text{fill:var(--muted); font:400 12px var(--sans)}
.ax-text.big{fill:var(--ink-2); font-size:12.5px}
.mark-label{fill:var(--ink); font:600 12.5px var(--display)}
.mark-label.sm{font-size:11.5px; font-weight:500; fill:var(--ink-2)}
.series-line{fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* legend */
.legend{display:flex; flex-wrap:wrap; gap:8px 20px; margin:0 0 16px; padding:0; list-style:none;
  font-size:13px; color:var(--ink-2)}
.legend li{display:flex; align-items:center; gap:8px}
.legend i{width:14px; height:4px; border-radius:2px; background:currentColor; display:block}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 9px)}
.legend i.dot{width:9px; height:9px; border-radius:50%}
.legend i.band{height:11px; opacity:.35; border-radius:2px}

/* stat tiles */
.stats{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); margin:0 0 26px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px}
.stat b{display:block; font-family:var(--display); font-weight:500; font-size:clamp(30px,3.6vw,42px);
  line-height:1; letter-spacing:-.03em; color:var(--ink)}
.stat b.gold{color:var(--seq-6)} .stat b.rose{color:var(--rose)} .stat b.cyan{color:#5cc3ea}
.stat .k{display:block; margin-top:10px; font-size:13.5px; color:var(--ink-2); line-height:1.45}
.stat .n{display:block; margin-top:6px; font-size:12px; color:var(--muted); line-height:1.45}

/* tooltip */
.tip{position:fixed; z-index:40; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
  background:#111927f2; border:1px solid #2b3a4e; border-radius:9px; padding:9px 11px;
  font:400 12.5px/1.5 var(--sans); color:var(--ink); box-shadow:0 18px 40px -20px #000;
  transition:opacity .12s ease; max-width:290px}
.tip b{font-family:var(--display); font-weight:600}
.tip .k{color:var(--muted)}

/* data tables */
details.numbers{margin-top:16px; border-top:1px solid var(--line); padding-top:12px}
details.numbers summary{cursor:pointer; font:500 13px var(--sans); color:var(--ink-2); list-style:none}
details.numbers summary::-webkit-details-marker{display:none}
details.numbers summary::before{content:"+ "; color:var(--seq-5)}
details.numbers[open] summary::before{content:"– "}
details.numbers .scroll-x{margin-top:12px}
table{border-collapse:collapse; font-size:13px; width:100%; min-width:400px}
th,td{text-align:left; padding:6px 14px 6px 0; border-bottom:1px solid var(--line); color:var(--ink-2);
  font-variant-numeric:tabular-nums}
th{color:var(--muted); font-weight:500; white-space:nowrap}
td.n,th.n{text-align:right; padding-right:18px}

/* callout */
.note{border-left:2px solid var(--seq-5); padding:2px 0 2px 18px; margin:26px 0 0;
  color:var(--ink-2); font-size:15px; max-width:44rem}
.note b{color:var(--ink); font-weight:600}

/* video */
.video{position:relative; padding-top:56.25%; border-radius:14px; overflow:hidden;
  border:1px solid var(--line); background:#000}
.video iframe{position:absolute; inset:0; width:100%; height:100%; border:0}

/* links out */
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); margin-top:8px}
.card{display:block; text-decoration:none; background:var(--panel); border:1px solid var(--line);
  border-radius:13px; padding:20px; transition:border-color .2s ease,transform .2s ease,background .2s ease}
.card:hover{border-color:#3b4c66; transform:translateY(-2px); background:var(--panel-2)}
.card .t{font-family:var(--display); font-weight:600; font-size:16.5px; display:flex; align-items:center; gap:8px}
.card .t svg{width:14px; height:14px; opacity:.55}
.card .d{color:var(--muted); font-size:13.5px; margin-top:7px; line-height:1.5}

footer{position:relative; z-index:3; border-top:1px solid var(--line); margin-top:10vh;
  padding:44px clamp(18px,4.5vw,64px) 70px; color:var(--muted); font-size:13.5px; line-height:1.7}
footer .wrap{display:grid; gap:28px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
footer h3{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); margin:0 0 10px}
footer a{color:var(--ink-2)}
footer ul{margin:0; padding:0; list-style:none}
footer li{margin-bottom:5px}

/* ---------------------------------------------------------- revision two */
.topbar{position:fixed; z-index:20; top:0; left:0; right:0; height:70px;
  display:flex; align-items:center; justify-content:space-between; gap:24px;
  padding:0 clamp(18px,4.5vw,64px); border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg,rgba(5,7,12,.92),rgba(5,7,12,.58));
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.topbar a{text-decoration:none}
.wordmark{font:600 14px/1 var(--display); letter-spacing:-.01em}
.topbar nav{display:flex; align-items:center; gap:clamp(16px,2.6vw,32px); font-size:13px}
.topbar nav a{color:var(--ink-2)}
.topbar nav a:hover{color:var(--ink)}
.topbar .nav-paper{color:var(--ink); border:1px solid var(--line-2); border-radius:999px;
  padding:9px 15px; background:rgba(12,18,28,.62)}

.hero-v2{min-height:100svh; display:flex; align-items:center; padding-top:118px; padding-bottom:92px;
  background:linear-gradient(90deg,rgba(5,7,12,.98) 0%,rgba(5,7,12,.88) 37%,rgba(5,7,12,.36) 64%,rgba(5,7,12,.08) 100%)}
.hero-grid{width:100%; display:grid; grid-template-columns:minmax(0,1.08fr) minmax(310px,.72fr);
  align-items:end; gap:clamp(40px,7vw,104px)}
.hero-copy{max-width:730px}
.hero-v2 .kicker{font:600 11px/1.45 var(--sans); letter-spacing:.16em; text-transform:uppercase;
  color:var(--seq-5); margin:0 0 22px}
.hero-v2 h1{font-size:clamp(46px,7.5vw,92px); font-weight:500; letter-spacing:-.052em;
  line-height:.98; margin:0; max-width:820px; text-wrap:balance;
  text-shadow:0 12px 52px rgba(0,0,0,.72)}
.hero-v2 h1 em{font-style:normal; color:var(--seq-6)}
.hero-lede{max-width:650px; margin:27px 0 0; color:#c1cada; font-size:clamp(16px,1.55vw,19px);
  line-height:1.62}
.hero-actions,.cta-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:30px}
.button{display:inline-flex; align-items:center; justify-content:center; min-height:45px; padding:0 19px;
  border-radius:999px; font:600 13.5px/1 var(--sans); text-decoration:none;
  transition:transform .2s ease,background .2s ease,border-color .2s ease}
.button:hover{transform:translateY(-2px)}
.button.primary{background:var(--ink); color:var(--bg); border:1px solid var(--ink)}
.button.secondary{background:rgba(8,12,20,.66); color:var(--ink); border:1px solid var(--line-2)}
.button.large{min-height:52px; padding:0 24px; font-size:14.5px}
.globe-key{position:absolute; right:clamp(18px,4.5vw,64px); bottom:22px; color:rgba(210,220,235,.62);
  font:500 10.5px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase}
.globe-key i{display:inline-block; width:6px; height:6px; margin-right:7px; border-radius:50%;
  background:var(--lamp); box-shadow:0 0 12px var(--lamp)}

.act{padding-top:clamp(86px,11vw,144px); padding-bottom:clamp(86px,11vw,144px)}
.first-act{padding-top:clamp(100px,12vw,160px)}
.section-intro{max-width:760px}
.section-intro h2,.paper-cta h2{font-size:clamp(35px,5.2vw,64px); margin:0 0 24px; text-wrap:balance}
.section-intro>p:not(.eyebrow){color:#bcc6d6; font-size:clamp(17px,1.7vw,20px); line-height:1.7; margin:0}
.section-intro b{color:var(--ink); font-weight:600}

.result-flow{display:grid; grid-template-columns:1fr 34px 1fr 34px 1fr; align-items:center;
  gap:12px; margin-top:52px; padding:24px 0; border-top:1px solid var(--line-2); border-bottom:1px solid var(--line)}
.flow-step{min-width:0}
.flow-step .flow-k{display:block; color:var(--muted); font-size:11px; letter-spacing:.11em;
  text-transform:uppercase; line-height:1.45}
.flow-step b{display:block; margin-top:9px; font:500 clamp(34px,5vw,62px)/1 var(--display); letter-spacing:-.045em}
.flow-step.selection b{color:var(--seq-6)}
.flow-step.total b{color:#d9e4f2}
.flow-arrow{text-align:center; color:var(--muted); font:400 26px/1 var(--display)}
.mechanism-line{display:grid; grid-template-columns:1fr minmax(44px,100px) 1fr minmax(44px,100px) 1fr;
  align-items:center; gap:18px; margin-top:54px}
.mechanism-line>div{min-height:190px; padding:24px 22px 20px; border-top:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(15,22,34,.82),rgba(8,12,20,.38))}
.mechanism-no{color:var(--seq-5); font:600 11px/1 var(--sans); letter-spacing:.13em}
.mechanism-line h3{font-size:25px; margin:33px 0 9px}
.mechanism-line p{margin:0; color:var(--ink-2); font-size:14px; line-height:1.5}
.mechanism-link{height:1px; background:linear-gradient(90deg,var(--line-2),var(--seq-5),var(--line-2)); position:relative}
.mechanism-link::after{content:""; position:absolute; right:-1px; top:-3px; width:7px; height:7px;
  border-top:1px solid var(--seq-5); border-right:1px solid var(--seq-5); transform:rotate(45deg)}
.boundary-head{display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,.46fr); align-items:end;
  gap:clamp(38px,8vw,110px); margin-bottom:46px}
.boundary-number{padding:18px 0 4px; border-top:1px solid var(--seq-5)}
.boundary-number>b{display:block; color:var(--seq-6); font:500 clamp(56px,7vw,88px)/.9 var(--display); letter-spacing:-.055em}
.boundary-number>span{display:block; color:var(--ink); font:500 18px/1.3 var(--display); margin-top:10px}
.boundary-number small{display:block; color:var(--muted); font-size:11.5px; line-height:1.5; margin-top:12px}
.responsive-figure{padding:clamp(16px,2.5vw,28px); overflow:hidden}
.thesis-line{max-width:860px; margin:34px auto 0; text-align:center; color:#d7dfeb;
  font:500 clamp(20px,2.8vw,30px)/1.45 var(--display); letter-spacing:-.02em}

.making{background:linear-gradient(180deg,rgba(6,9,15,.90),rgba(8,12,20,.96))}
.author-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-top:54px;
  border-top:1px solid var(--line-2); border-bottom:1px solid var(--line)}
.author-entry{display:grid; grid-template-columns:82px minmax(0,1fr); gap:18px; align-content:start;
  padding:26px 24px 28px 0}
.author-entry+.author-entry{border-left:1px solid var(--line); padding-left:24px}
.author-portrait,.author-logo{width:82px; height:82px; border-radius:50%; border:1px solid var(--line-2);
  background:#0c121c}
.author-portrait{display:block; object-fit:cover}
.author-logo{display:grid; place-items:center}
.author-logo img{display:block; width:43px; height:43px; filter:invert(1); opacity:.90}
.author-company{margin:1px 0 6px; color:var(--seq-5); font-size:9.5px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase}
.author-entry h3{font-size:22px; margin:0 0 10px}
.author-entry>div>p:last-child{margin:0; color:var(--ink-2); font-size:13px; line-height:1.58}
.record-link{margin:24px 0 0; font-size:13px}
.record-link a{color:var(--ink-2); text-decoration-color:var(--line-2); text-underline-offset:4px}
.record-link a:hover{color:var(--ink)}

.paper-cta{text-align:center; min-height:84svh; display:flex; align-items:center}
.paper-cta .wrap{max-width:960px}
.paper-cta h2{font-size:clamp(42px,7vw,78px); margin-bottom:24px}
.cta-lede{max-width:720px; margin:0 auto; color:var(--ink-2); font-size:17px; line-height:1.7}
.cta-actions{justify-content:center}
.resource-links{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; margin-top:54px; text-align:left;
  background:var(--line)}
.resource-links a,.resource-links button{background:rgba(8,12,20,.94); text-decoration:none; color:var(--ink-2); padding:18px 16px;
  font-size:12.5px; line-height:1.45; transition:background .2s ease,color .2s ease}
.resource-links button{border:0; border-radius:0; font-family:inherit; text-align:left; cursor:pointer}
.resource-links a:hover,.resource-links button:hover{background:var(--panel-2); color:var(--ink)}
.resource-links span{display:block; color:var(--seq-5); font-size:9.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; margin-bottom:7px}
.resource-links b{font-weight:400}
.footer-v2{grid-template-columns:1.6fr 1fr .6fr}
.footer-v2 p{margin:0 0 8px}

@media (max-width:820px){
  .topbar{height:58px}
  .topbar{backdrop-filter:none; -webkit-backdrop-filter:none}
  .topbar nav>a:not(.nav-paper){display:none}
  .topbar .nav-paper{padding:8px 12px}
  .hero-v2{padding-top:92px; padding-bottom:84px; align-items:flex-start;
    background:linear-gradient(180deg,rgba(5,7,12,.90) 0%,rgba(5,7,12,.74) 45%,rgba(5,7,12,.94) 100%)}
  .hero-grid{grid-template-columns:1fr}
  .hero-copy{max-width:620px}
  .hero-v2 h1{font-size:clamp(43px,13vw,68px)}
  .hero-lede{font-size:16px; line-height:1.58}
  .act{background:linear-gradient(180deg,rgba(5,7,12,.91),rgba(5,7,12,.87))}
  .rise,.rise.seen{opacity:1; transform:none; transition:none}
  .globe-key{left:18px; right:auto; bottom:18px}
  .result-flow{grid-template-columns:1fr; gap:0; padding:0; border-bottom:0}
  .flow-step{padding:19px 0; border-bottom:1px solid var(--line)}
  .flow-arrow{display:none}
  .flow-step .flow-k{font-size:10px}
  .mechanism-line{grid-template-columns:1fr; gap:0; margin-top:40px}
  .mechanism-line>div{min-height:auto; padding:20px 18px}
  .mechanism-line h3{margin:16px 0 6px}
  .mechanism-link{width:1px; height:32px; margin-left:30px; background:linear-gradient(180deg,var(--line-2),var(--seq-5))}
  .mechanism-link::after{right:-3px; top:auto; bottom:-1px; transform:rotate(135deg)}
  .boundary-head{grid-template-columns:1fr; gap:28px}
  .boundary-number{max-width:420px}
  .author-strip{grid-template-columns:1fr}
  .author-entry{padding:22px 0}
  .author-entry+.author-entry{border-left:0; border-top:1px solid var(--line); padding-left:0}
  .resource-links{grid-template-columns:1fr 1fr}
  .footer-v2{grid-template-columns:1fr}
}

@media (max-width:480px){
  .chapter{padding-left:18px; padding-right:18px}
  .hero-v2 h1{font-size:clamp(42px,12.7vw,58px)}
  .hero-actions .button{flex:1}
  .section-intro h2{font-size:38px}
  .section-intro>p:not(.eyebrow){font-size:16px; line-height:1.63}
  figure{padding:14px 10px}
  .fig-title,.fig-sub,figcaption{padding-left:4px; padding-right:4px}
  .resource-links{grid-template-columns:1fr}
  .cta-actions{flex-direction:column}
}

@media (max-width:820px){
  body{font-size:16px}
  .beat{min-height:104svh}
  .panel{max-width:none}
  #hud .year{font-size:clamp(34px,11vw,54px)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rise{opacity:1; transform:none; transition:none}
  .cue span{animation:none}
}
</style>
</head>
