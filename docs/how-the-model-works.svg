<svg width="680" height="560" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How the population model works</title>
<desc>Assumptions about fertility, survival and migration feed a projection engine that ages a population forward one year at a time and loops from 2024 to 2150. The assumptions are supplied today by UN WPP 2024; the project's own mechanism is not built yet. Purple marks where theory lives, grey marks pure bookkeeping. Every element also carries light-mode presentation attributes, so the diagram still reads if a host strips the stylesheet.</desc>
<style>
svg{--p:#2C2C2A;--s:#5F5E5A;--b:#D3D1C7;--boxf:#FFFFFF;--boxs:#B4B2A9;
--pf:#EEEDFE;--ps:#534AB7;--pt:#3C3489;--pst:#534AB7;
--gf:#F1EFE8;--gs:#5F5E5A;--gt:#444441;--gst:#5F5E5A;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--p:#F1EFE8;--s:#B4B2A9;--b:#5F5E5A;--boxf:#2C2C2A;--boxs:#5F5E5A;
--pf:#3C3489;--ps:#AFA9EC;--pt:#CECBF6;--pst:#AFA9EC;
--gf:#444441;--gs:#B4B2A9;--gt:#D3D1C7;--gst:#B4B2A9}}
.ts{font-size:12px;font-weight:400;fill:var(--s)}
.th{font-size:14px;font-weight:500;fill:var(--p)}
.box{fill:var(--boxf);stroke:var(--boxs)}
.pur rect{fill:var(--pf);stroke:var(--ps)}
.pur .th{fill:var(--pt)}
.pur .ts{fill:var(--pst)}
.gry rect{fill:var(--gf);stroke:var(--gs)}
.gry .th{fill:var(--gt)}
.gry .ts{fill:var(--gst)}
.arr{stroke:var(--s)}
.pen{stroke:var(--b)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="pur">
<rect x="150" y="40" width="180" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="th" x="240" y="65" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">UN WPP 2024</text>
<text class="ts" x="240" y="83" text-anchor="middle" font-size="12" fill="#534AB7">in use today</text>
</g>
<g class="pur">
<rect x="354" y="40" width="180" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5" stroke-dasharray="5 4"/>
<text class="th" x="444" y="65" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">our own mechanism</text>
<text class="ts" x="444" y="83" text-anchor="middle" font-size="12" fill="#534AB7">phase 5, not built yet</text>
</g>

<line class="arr" x1="240" y1="100" x2="240" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="arr" x1="444" y1="100" x2="444" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="pen" x="150" y="134" width="384" height="88" rx="4" fill="none" stroke="#D3D1C7" stroke-width=".5" stroke-dasharray="5 4"/>
<text class="th" x="162" y="156" font-size="14" font-weight="500" fill="#2C2C2A">the assumptions</text>
<text class="ts" x="162" y="173" font-size="12" fill="#5F5E5A">all the argument is here</text>
<g class="pur">
<rect x="162" y="182" width="112" height="32" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="th" x="218" y="203" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">fertility</text>
</g>
<g class="pur">
<rect x="286" y="182" width="112" height="32" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="th" x="342" y="203" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">survival</text>
</g>
<g class="pur">
<rect x="410" y="182" width="112" height="32" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="th" x="466" y="203" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">migration</text>
</g>

<line class="arr" x1="340" y1="222" x2="340" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="pen" x="196" y="250" width="288" height="212" rx="4" fill="none" stroke="#D3D1C7" stroke-width=".5" stroke-dasharray="5 4"/>
<text class="th" x="210" y="272" font-size="14" font-weight="500" fill="#2C2C2A">the engine</text>
<text class="ts" x="210" y="290" font-size="12" fill="#5F5E5A">no theory about the future</text>
<g class="gry">
<rect x="212" y="306" width="256" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="340" y="325" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">age everyone up one year</text>
<text class="ts" x="340" y="342" text-anchor="middle" font-size="12" fill="#5F5E5A">thinned by survival rates</text>
</g>
<g class="gry">
<rect x="212" y="360" width="256" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="340" y="379" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">count this year's births</text>
<text class="ts" x="340" y="396" text-anchor="middle" font-size="12" fill="#5F5E5A">women &#215; fertility rate</text>
</g>
<g class="gry">
<rect x="212" y="414" width="256" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="340" y="437" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">add net migrants</text>
</g>

<rect class="box" x="40" y="324" width="132" height="64" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width=".5"/>
<text class="th" x="106" y="351" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">1 jan 2024</text>
<text class="ts" x="106" y="369" text-anchor="middle" font-size="12" fill="#5F5E5A">by age and sex</text>
<rect class="box" x="508" y="324" width="132" height="64" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width=".5"/>
<text class="th" x="574" y="351" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">1 jan 2025</text>
<text class="ts" x="574" y="369" text-anchor="middle" font-size="12" fill="#5F5E5A">by age and sex</text>

<line class="arr" x1="172" y1="356" x2="196" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="arr" x1="484" y1="356" x2="508" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<path class="arr" d="M574 388 L574 496 L106 496 L106 392" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="514" text-anchor="middle" font-size="12" fill="#5F5E5A">repeat once a year &#8212; 2024 to 2150</text>

<g class="pur"><rect x="180" y="528" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/></g>
<text class="ts" x="198" y="538" font-size="12" fill="#5F5E5A">theory lives here</text>
<g class="gry"><rect x="360" y="528" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/></g>
<text class="ts" x="378" y="538" font-size="12" fill="#5F5E5A">pure bookkeeping</text>
</svg>
