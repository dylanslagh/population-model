<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="684pt" height="463.464pt" viewBox="0 0 684 463.464" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="model-flow-title model-flow-desc"><title id="model-flow-title">How this population model works</title><desc id="model-flow-desc">Both models start with population, fertility, survival, migration, and sex-ratio data. The UN-style baseline projects future rate paths and passes them through a demographic ledger. This project also models how fertility environment and population composition interact, then reports population, composition, selection, rebound, scenario, and uncertainty outputs.</desc>
