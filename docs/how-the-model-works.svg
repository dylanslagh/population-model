   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #252523" x="342" y="30.011029" transform="rotate(-0 342 30.011029)">How this population model works</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #62605a" x="342" y="44.073124" transform="rotate(-0 342 44.073124)">The demographic bookkeeping is shared. The theory of future fertility is not.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(232.276172 68.576734)">STARTING EVIDENCE USED BY BOTH</text>
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(101.86193 83.924445)">2024 population by country, age and sex  •  fertility by age  •  survival by age</text>
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(200.82882 100.274445)">migration by age and sex  •  sex ratio at birth</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #185fa5" x="174.6" y="127.802013" transform="rotate(-0 174.6 127.802013)">UN-STYLE BASELINE USED HERE</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f6e56" x="509.4" y="127.802013" transform="rotate(-0 509.4 127.802013)">THIS PROJECT'S MECHANISM MODEL</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(126.384609 144.041105)">FUTURE RATE PATHS</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(91.936547 157.313465)">Fertility, survival and migration are</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(122.650313 171.413465)">statistically projected.</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(74.188172 185.513465)">Post-transition fertility tends to move back</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(118.562781 199.613465)">toward a long-run level.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(421.349172 150.006931)">RATE PATHS + FERTILITY MECHANISM</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(415.806109 163.279291)">fertility environment  ×  family-size mix</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(402.123969 177.379291)">family-size spread + parent–child persistence</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(393.8035 191.479291)">named-group fertility + retention + convergence</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(388.081984 205.579291)">unresolved future choices stay explicit as scenarios</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(79.401563 237.624334)">YEARLY DEMOGRAPHIC LEDGER</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(60.37125 254.567772)">1  Age everyone   •   2  Apply survival</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(65.408438 272.567772)">3  Add births      •   4  Add migration</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(409.72275 230.887553)">MECHANISM CHANGES BIRTHS FIRST</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(426.644156 246.136647)">environment × population mix</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(459.034031 262.336647)">→  realized fertility</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(384.136031 278.536647)">then use the same yearly demographic ledger</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(151.519469 316.295134)">OUTPUTS</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(88.033078 330.132274)">Population by country, age and sex</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(141.319813 344.832274)">through 2150</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(55.674703 359.532274)">+ a conventional UW-posterior uncertainty band</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(487.261531 313.795975)">OUTPUTS</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(432.530766 327.068334)">The same population paths, plus</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(404.849969 341.168334)">population composition and selection effect,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(422.203984 355.268334)">whether and when fertility rebounds,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(398.232516 369.368334)">scenario ranges and an uncertainty breakdown</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(150.115984 391.765894)">UN-style question:  If these future rates occur, how many people follow?</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(265.011703 407.665894)">This project's extra question:</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #252523" transform="translate(126.158328 423.565894)">How do the rates change when the environment and the population mix change?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #62605a" x="342" y="441.195151" transform="rotate(-0 342 441.195151)">Conceptual map, not every source-file or fitting step. Official WPP projections end in 2100; this repo holds 2100 rates constant to reach 2150.</text>
   </g>
  </g>
 </g>
